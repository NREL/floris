name: TurbOParkGauss
description: Three turbines using TurbOParkGauss model
floris_version: v5
logging:
  console:
    enable: false
    level: WARNING
  file:
    enable: false
    level: WARNING
solver:
  type: turbine_cubature_grid
  turbine_grid_points: 4
farm:
  layout_x:
  - 0.0
  - 630.0
  - 1260.0
  layout_y:
  - 0.0
  - 0.0
  - 0.0
  turbine_type:
  - nrel_5MW
flow_field:
  air_density: 1.225
  reference_wind_height: -1
  turbulence_intensities:
  - 0.06
  wind_directions:
  - 270.0
  wind_shear: 0.12
  wind_speeds:
  - 8.0
  wind_veer: 0.0
wake:
  model: turboparkgauss
  parameters:
    A: 0.04
    include_mirror_wake: true
  combination_model: sosfs
