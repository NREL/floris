name: GCH multi dimensional power/thrust coefficient
description: Three turbines using GCH model
floris_version: v5
logging:
  console:
    enable: true
    level: WARNING
  file:
    enable: false
    level: WARNING
solver:
  type: turbine_grid
  turbine_grid_points: 3
farm:
  layout_x:
  - 0.0
  - 630.0
  - 1260.0
  layout_y:
  - 0.0
  - 0.0
  - 0.0
  turbine_type:
  - iea_15MW_multi_dim_TI.yaml
  external_turbine_library_path: ../inputs/turbine_files/
flow_field:
  multidim_conditions:
    TI: 0.06
  air_density: 1.225
  reference_wind_height: -1
  turbulence_intensities:
  - 0.06
  wind_directions:
  - 270.0
  wind_shear: 0.12
  wind_speeds:
  - 8.0
  wind_veer: 0.0
wake:
  model: gauss
  parameters:
    initial: 0.01
    constant: 0.9
    ai: 0.83
    downstream: -0.25
    ad: 0.0
    alpha: 0.58
    bd: 0.0
    beta: 0.077
    dm: 1.0
    ka: 0.38
    kb: 0.004
  combination_model: sosfs
