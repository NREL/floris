name: GCH
description: Example of single floating turbine
floris_version: v5
logging:
  console:
    enable: true
    level: WARNING
  file:
    enable: false
    level: WARNING
solver:
  type: turbine_grid
  turbine_grid_points: 3
farm:
  layout_x:
  - 0.0
  layout_y:
  - 0.0
  turbine_type:
  - !include turbine_files/nrel_5MW_floating.yaml
flow_field:
  air_density: 1.225
  reference_wind_height: -1
  turbulence_intensities:
  - 0.06
  wind_directions:
  - 270.0
  wind_shear: 0.12
  wind_speeds:
  - 8.0
  wind_veer: 0.0
wake:
  model: gauss
  parameters:
    initial: 0.1
    constant: 0.5
    ai: 0.8
    downstream: -0.32
    ad: 0.0
    alpha: 0.58
    bd: 0.0
    beta: 0.077
    dm: 1.0
    ka: 0.38
    kb: 0.004
    enable_secondary_steering: true
    enable_yaw_added_recovery: true
    enable_transverse_velocities: true
  combination_model: sosfs
