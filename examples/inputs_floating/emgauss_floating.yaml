name: Emperical Gaussian
description: Example of single floating turbine
floris_version: v5
logging:
  console:
    enable: true
    level: WARNING
  file:
    enable: false
    level: WARNING
solver:
  type: turbine_grid
  turbine_grid_points: 3
farm:
  layout_x:
  - 0.0
  - 630.0
  - 1260.0
  layout_y:
  - 0.0
  - 0.0
  - 0.0
  turbine_type:
  - !include turbine_files/nrel_5MW_floating.yaml
flow_field:
  air_density: 1.225
  reference_wind_height: -1
  turbulence_intensities:
  - 0.06
  wind_directions:
  - 270.0
  wind_shear: 0.12
  wind_speeds:
  - 8.0
  wind_veer: 0.0
wake:
  model: empirical_gauss
  parameters:
    atmospheric_ti_gain: 0.0
    horizontal_deflection_gain_D: 3.0
    vertical_deflection_gain_D: -1
    deflection_rate: 22
    mixing_gain_deflection: 0.0
    yaw_added_mixing_gain: 0.0
    wake_expansion_rates:
    - 0.023
    - 0.008
    breakpoints_D:
    - 10
    sigma_0_D: 0.28
    smoothing_length_D: 2.0
    mixing_gain_velocity: 2.0
    enable_yaw_added_recovery: true
    enable_active_wake_mixing: false
  combination_model: sosfs
